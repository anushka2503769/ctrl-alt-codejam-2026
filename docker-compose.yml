services:
  verification-runtime:
    build:
      context: .
      dockerfile: Dockerfile.runtime
      args:
        NODE_IMAGE: ${CONTAINER_RUNTIME_BASE_IMAGE:-node:22-bookworm-slim}
        DEBIAN_MIRROR: ${CONTAINER_APT_MIRROR:-}
        DEBIAN_SECURITY_MIRROR: ${CONTAINER_APT_SECURITY_MIRROR:-}
        RUNTIME_APT_PACKAGES: ${CONTAINER_RUNTIME_APT_PACKAGES:-ca-certificates git ripgrep}
    image: ${CONTAINER_RUNTIME_IMAGE:-volc-agent-runtime:local}
    command: ["true"]
    restart: "no"

  launchpad:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${CONTAINER_RUNTIME_BASE_IMAGE:-node:22-bookworm-slim}
        DEBIAN_MIRROR: ${CONTAINER_APT_MIRROR:-}
        DEBIAN_SECURITY_MIRROR: ${CONTAINER_APT_SECURITY_MIRROR:-}
    image: volc-agent-launchpad:local
    restart: unless-stopped
    depends_on:
      verification-runtime:
        condition: service_completed_successfully
    env_file:
      - ${LAUNCHPAD_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      APP_DATA_DIR: /app/data
      AGENT_WORKSPACE_ROOT: /app/workspaces
      VERIFICATION_PROVIDER: container
      VERIFICATION_WORKSPACE_HOST_ROOT: ${PWD}/workspaces
      CONTAINER_ENGINE: /usr/local/bin/docker
      DOCKER_HOST: unix:///var/run/docker.sock
      CODEX_HOME: /app/codex-home
      CODEX_SANDBOX_MODE: ${CODEX_SANDBOX_MODE:-workspace-write}
    ports:
      - "${PUBLIC_PORT:-3000}:3000"
    volumes:
      - ./data:/app/data
      - ./workspaces:/app/workspaces
      - ./codex-home:/app/codex-home
      - ${CONTAINER_ENGINE_BINARY:-/usr/bin/docker}:/usr/local/bin/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-0}"
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    mem_limit: 4g
    cpus: 2
